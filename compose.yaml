services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: nexora_app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - nexora

  node:
    image: node:22-alpine
    container_name: nexora_node
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    command: tail -f /dev/null
    networks:
      - nexora

  nginx:
    image: nginx:alpine
    container_name: nexora_nginx
    ports:
      - "80:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - nexora

  db:
    image: postgres:18
    container_name: nexora_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexora
      POSTGRES_USER: nexora
      POSTGRES_PASSWORD: nexora
    volumes:
      - nexora_db_data:/var/lib/postgresql
    networks:
      - nexora

networks:
  nexora:

volumes:
  nexora_db_data: